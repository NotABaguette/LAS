name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux Artifacts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: amd64
            goarch: amd64
            goarm: ""
          - name: arm64
            goarch: arm64
            goarm: ""
          - name: armv7
            goarch: arm
            goarm: "7"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build Binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.target.goarch }}
          GOARM: ${{ matrix.target.goarm }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/lasd ./cmd/lasd

      - name: Package Artifact
        run: |
          version="${GITHUB_REF_NAME:-manual}"
          name="LAS-${version}-linux-${{ matrix.target.name }}"
          mkdir -p "dist/${name}"
          cp dist/lasd "dist/${name}/lasd"
          cp README.md "dist/${name}/README.md"
          cp -R configs docs scripts systemd web "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          sha256sum "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LAS-linux-${{ matrix.target.name }}
          path: |
            dist/LAS-*.tar.gz
            dist/LAS-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-dist/* \
              --title "$GITHUB_REF_NAME" \
              --notes "Automated LAS release for $GITHUB_REF_NAME."
          fi

